<!DOCTYPE html>
<html>
<head>
  <title>Lead Form Test</title>
  <style>
    body {
      font-family: Arial;
      max-width: 500px;
      margin: 40px auto;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    pre {
      background: #f4f4f4;
      padding: 10px;
      overflow: auto;
    }
  </style>
</head>
<body>

<h1>Lead Form Test</h1>

<form id="leadForm">
  <input type="text" id="first_name" placeholder="First Name" required />
  <input type="text" id="last_name" placeholder="Last Name" required />
  <input type="tel" id="phone" placeholder="+15555555555" required />

  <div class="checkbox">
    <input type="checkbox" id="smsConsent" />
    <label for="smsConsent">SMS Consent</label>
  </div>

  <button type="submit">Submit</button>
</form>

<h3>Generated Payload</h3>
<pre id="output"></pre>

<script>
function generateUUID() {
  return crypto.randomUUID();
}

function generateInvocaAttributionId() {
  return "2967/1491503369/i-" + generateUUID();
}

document.getElementById("leadForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const payload = {
    external_id: generateUUID(),
    event_data: {
      occurred_at: new Date().toISOString(),
      first_name: document.getElementById("first_name").value,
      last_name: document.getElementById("last_name").value,
      email_address: document.getElementById("email").value,
      phone_number: document.getElementById("phone").value,
      sms_consent: document.getElementById("smsConsent").checked,
      invoca_attribution_id: generateInvocaAttributionId()
    }
  };

  document.getElementById("output").textContent =
    JSON.stringify(payload, null, 2);

  // TEST ENDPOINT
  // Replace with actual endpoint later

  try {
    const response = await fetch("https://webhook.site/f42ebc31-2344-48d6-9101-bcd57c484981", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    console.log(await response.text());
    alert("Submitted!");
  } catch (err) {
    console.error(err);
    alert("Error submitting form");
  }
});
</script>

</body>
</html>
